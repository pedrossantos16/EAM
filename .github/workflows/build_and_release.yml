name: Build and Release OTA Update

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Increment Version in version.properties
        run: |
          if [ -f version.properties ]; then
            VERSION_CODE=$(grep 'VERSION_CODE' version.properties | cut -d '=' -f 2)
            NEW_VERSION_CODE=$((VERSION_CODE + 1))
            
            sed -i "s/VERSION_CODE=$VERSION_CODE/VERSION_CODE=$NEW_VERSION_CODE/" version.properties
            
            # Atualiza o version.json apontando direto para a página de Releases do GitHub (sem erro 404)
            echo "{
              \"versionCode\": $NEW_VERSION_CODE,
              \"versionName\": \"1.0.$NEW_VERSION_CODE\",
              \"apkUrl\": \"https://github.com/${{ github.repository }}/releases/latest\",
              \"releaseNotes\": \"Nova versão automática #$NEW_VERSION_CODE gerada via commit.\"
            }" > version.json

            git add version.properties version.json
            git commit -m "chore: bump version to $NEW_VERSION_CODE [skip ci]"
            git push
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') == false
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "EAM v1.0.${{ github.run_number }}"
          body: "Nova atualização automática gerada via GitHub Actions. Baixe o APK abaixo."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
