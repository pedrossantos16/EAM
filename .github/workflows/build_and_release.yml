name: Build and Release OTA Update (Signed Release)

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Increment Version in version.properties
        run: |
          if [ -f version.properties ]; then
            VERSION_CODE=$(grep 'VERSION_CODE' version.properties | cut -d '=' -f 2)
            NEW_VERSION_CODE=$((VERSION_CODE + 1))
            NEW_VERSION_NAME="1.0.$NEW_VERSION_CODE"
            
            sed -i "s/VERSION_CODE=$VERSION_CODE/VERSION_CODE=$NEW_VERSION_CODE/" version.properties
            sed -i "s/VERSION_NAME=.*/VERSION_NAME=$NEW_VERSION_NAME/" version.properties
            
            echo "NEW_VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV
            echo "NEW_VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV
          fi

      - name: Verify GitHub Secrets Exist
        run: |
          MISSING=""
          [ -z "${{ secrets.EAM_KEYSTORE_BASE64 }}" ] && MISSING="$MISSING EAM_KEYSTORE_BASE64"
          [ -z "${{ secrets.EAM_KEYSTORE_PASSWORD }}" ] && MISSING="$MISSING EAM_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.EAM_KEY_ALIAS }}" ] && MISSING="$MISSING EAM_KEY_ALIAS"
          [ -z "${{ secrets.EAM_KEY_PASSWORD }}" ] && MISSING="$MISSING EAM_KEY_PASSWORD"
          
          if [ -n "$MISSING" ]; then
            echo "❌ ERRO CRÍTICO: Os seguintes Secrets do GitHub estão ausentes:$MISSING"
            echo "Por favor, cadastre todos os 4 secrets em Settings > Secrets and variables > Actions."
            exit 1
          else
            echo "✅ Todos os 4 secrets obrigatórios estão presentes."
          fi

      - name: Decode Keystore from Secrets and Validate
        run: |
          mkdir -p app
          echo "${{ secrets.EAM_KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
          
          if [ ! -s "app/release.jks" ]; then
            echo "❌ ERRO: O arquivo app/release.jks não foi gerado ou está vazio após a decodificação Base64."
            exit 1
          else
            echo "✅ Keystore decodificada com sucesso em app/release.jks (tamanho: $(stat -c%s app/release.jks) bytes)."
          fi

      - name: Build Release APK
        env:
          EAM_KEYSTORE_PATH: "app/release.jks"
          EAM_KEYSTORE_PASSWORD: "${{ secrets.EAM_KEYSTORE_PASSWORD }}"
          EAM_KEY_ALIAS: "${{ secrets.EAM_KEY_ALIAS }}"
          EAM_KEY_PASSWORD: "${{ secrets.EAM_KEY_PASSWORD }}"
        run: ./gradlew assembleRelease

      - name: Verify APK Signature & Details
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          
          NEW_APK_NAME="EAM-${{ env.NEW_VERSION_NAME }}.apk"
          mv "$APK_PATH" "app/build/outputs/apk/release/$NEW_APK_NAME"
          FINAL_APK_PATH="app/build/outputs/apk/release/$NEW_APK_NAME"
          
          echo "FINAL_APK_PATH=$FINAL_APK_PATH" >> $GITHUB_ENV
          echo "FINAL_APK_NAME=$NEW_APK_NAME" >> $GITHUB_ENV

          SHA256=$(sha256sum "$FINAL_APK_PATH" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$FINAL_APK_PATH")
          
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV

          if [ -f "app/release.jks" ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$FINAL_APK_PATH"
          fi

      - name: Create Git Tag and GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.FINAL_APK_PATH }}
          tag_name: v${{ env.NEW_VERSION_NAME }}
          name: "EAM v${{ env.NEW_VERSION_NAME }}"
          body: "Nova versão release assinado v${{ env.NEW_VERSION_NAME }} gerada automaticamente."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json and Commit
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ env.NEW_VERSION_NAME }}/${{ env.FINAL_APK_NAME }}"
          
          echo "{
            \"versionCode\": ${{ env.NEW_VERSION_CODE }},
            \"versionName\": \"${{ env.NEW_VERSION_NAME }}\",
            \"apkUrl\": \"$DOWNLOAD_URL\",
            \"sha256\": \"${{ env.SHA256 }}\",
            \"apkSize\": ${{ env.APK_SIZE }},
            \"minimumSupportedVersionCode\": 1,
            \"releaseNotes\": \"Nova versão de produção v${{ env.NEW_VERSION_NAME }}.\"
          }" > version.json

          git add version.properties version.json
          git commit -m "release: bump version to ${{ env.NEW_VERSION_NAME }} [skip ci]"
          git push
          
          rm -f app/release.jks
