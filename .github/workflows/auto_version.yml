name: Auto Increment Version on Push

on:
  push:
    branches: [ "main", "master" ]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Increment Version Code
        run: |
          if [ -f version.properties ]; then
            VERSION_CODE=$(grep 'VERSION_CODE' version.properties | cut -d '=' -f 2)
            NEW_VERSION_CODE=$((VERSION_CODE + 1))
            sed -i "s/VERSION_CODE=$VERSION_CODE/VERSION_CODE=$NEW_VERSION_CODE/" version.properties
            
            git add version.properties
            git commit -m "chore: bump VERSION_CODE to $NEW_VERSION_CODE [skip ci]"
            git push
          fi
